<!--
    Exercise 1: Create a Table
Objective: Use <table> to organize data.

Create a table with three columns: Name, Age, and Favorite Color.
Apply inline styles to:
Set the background color of the header row to lightgray.
Add borders to all cells.
Set padding inside each cell to 8px.

Exercise 2: Embed Multimedia
Objective: Use <audio> and <video> elements.
Add an audio file and a video file with controls.
Apply inline styles to:
Set the width of the video to 400px.
Align the audio player to the center.

Exercise 3: Apply Semantic HTML
Objective: Use semantic tags to structure a webpage.
Build a webpage with a <header>, two <article> sections, and a <footer>.
Apply inline styles to:
Set the background color of the header to navy and text color to white.
Add margin and padding to the articles.
Align the footer text to the center.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr style="background-color:lightgray">
            <th>Name</th>
            <th>Age</th>
            <th>Favorite Color</th>
        </tr>
    </table>
</body>
</html>
